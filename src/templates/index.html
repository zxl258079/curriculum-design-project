<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8">
<title>IMS轴承剩余寿命预测系统</title>
<style>
*{box‑sizing:border‑box;font‑family:Microsoft Yahei;}
body{max‑width:900px;margin:30px auto;padding:0 20px;}
.box{border:1px solid #ccc;padding:16px;margin‑bottom:20px;border‑radius:8px;}
input{padding:8px;width:260px;margin:6px 0;}
button{padding:8px 16px;background:#2385bb;color:#fff;border:none;border‑radius:4px;cursor:pointer;}
table{width:100%;border‑collapse:collapse;margin‑top:10px;}
th,td{border:1px solid #aaa;padding:8px;text‑align:center;}
th{background:#eee;}
</style>
</head>
<body>
<h1>IMS轴承剩余寿命RUL预测系统</h1>

<div class="box">
<h3>1.设备信息录入</h3>
<div>设备名称：<input id="equip_name" placeholder="输入设备名称"></div>
<div>设备型号：<input id="equip_model" placeholder="输入设备型号"></div>
<button onclick="addDevice()">录入设备</button>
<div id="add_res"></div>
</div>

<div class="box">
<h3>2.剩余寿命预测</h3>
<div>设备编号：<input id="dev_id" placeholder="填入设备编号"></div>
<button onclick="doPredict()">执行预测</button>
<div id="pred_res"></div>
</div>

<div class="box">
<h3>3.历史记录查询</h3>
<div>设备编号(留空查全部)：<input id="q_dev_id" placeholder="留空查询全部"></div>
<button onclick="queryHistory()">查询</button>
<div id="history_box"></div>
</div>

<script>
const base="/api";

async function addDevice(){
    const name=document.getElementById("equip_name").value.trim();
    const model=document.getElementById("equip_model").value.trim();
    const res=await fetch(base+"/add_device",{
        method:"POST",
        headers:{"Content‑Type":"application/json"},
        body:JSON.stringify({equip_name:name,equip_model:model})
    });
    const json=await res.json();
    document.getElementById("add_res").innerText="录入成功，设备编号："+json.device_id;
}

async function doPredict(){
    const devId=document.getElementById("dev_id").value.trim();
    const res=await fetch(base+"/predict_rul",{
        method:"POST",
        headers:{"Content‑Type":"application/json"},
        body:JSON.stringify({device_id:Number(devId)})
    });
    const json=await res.json();
    const html=`
预测RUL：${json.rul}<br>
健康状态：${json.health_status}<br>
运维建议：${json.advice}
`;
    document.getElementById("pred_res").innerHTML=html;
}

async function queryHistory(){
    const devId=document.getElementById("q_dev_id").value.trim();
    const bodyObj= devId ? {device_id:Number(devId)} : {};
    const res=await fetch(base+"/query_history",{
        method:"POST",
        headers:{"Content‑Type":"application/json"},
        body:JSON.stringify(bodyObj)
    });
    const json=await res.json();
    let html="<table><tr><th>ID</th><th>设备名称</th><th>型号</th><th>RUL</th><th>健康状态</th><th>运维建议</th><th>时间</th></tr>";
    json.data.forEach(item=>{
        html+=`<tr>
<td>${item.id}</td>
<td>${item.equip_name}</td>
<td>${item.equip_model}</td>
<td>${item.pred_rul}</td>
<td>${item.health_status}</td>
<td>${item.advice}</td>
<td>${item.predict_time}</td>
</tr>`;
    });
    html+="</table>";
    document.getElementById("history_box").innerHTML=html;
}
</script>
</body>
</html>
